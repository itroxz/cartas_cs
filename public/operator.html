<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operador - Cartas CS</title>
    <link rel="stylesheet" href="styles/operator.css">
</head>
<body>
    <!-- Marca d'água NFA -->
    <div class="watermark-container">
        <img src="Logo/LOGO_NFA_W.png" alt="NFA" class="watermark watermark-1">
        <img src="Logo/LOGO_NFA_W.png" alt="NFA" class="watermark watermark-2">
    </div>
    
    <div class="container">
        <!-- Título -->
        <div class="page-title">
            <h1>All Star League by NFA</h1>
        </div>
        
        <!-- Seleção de Time (movido para cima) -->
        <div class="team-selector">
            <button class="btn-team" id="btnSelectTeam1">TIME 1</button>
            <button class="btn-team" id="btnSelectTeam2">TIME 2</button>
        </div>
        
        <!-- Área de cartas (ocupa maior parte da tela) -->
        <div class="cards-area">
            <div class="team-header">
                <h2 id="teamName">Selecione um time</h2>
                <span class="side-badge" id="teamSide"></span>
                <span class="card-counter" id="cardCounter">0/6</span>
            </div>
            
            <div class="cards-grid" id="cardsGrid">
                <!-- Cartas serão inseridas aqui via JS -->
            </div>
        </div>
    </div>
    
    <!-- Modal de Confirmação Touch-Friendly -->
    <div class="confirm-modal" id="confirmModal">
        <div class="confirm-overlay" onclick="closeConfirmModal()"></div>
        <div class="confirm-dialog">
            <div class="confirm-icon">⚠️</div>
            <h3 class="confirm-title">Confirmar Revelação</h3>
            <p class="confirm-message" id="confirmMessage"></p>
            <div class="confirm-buttons">
                <button class="btn-cancel" onclick="closeConfirmModal()">CANCELAR</button>
                <button class="btn-confirm" id="btnConfirm">REVELAR</button>
            </div>
        </div>
    </div>
    
    <script src="scripts/operator.js"></script>
</body>
</html>
