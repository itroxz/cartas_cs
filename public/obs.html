<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBS - Carta Revelada</title>
    <link rel="stylesheet" href="styles/obs.css">
</head>
<body>
    <div id="obsWrapper" class="obs-wrapper hidden">
        <div class="team-name-display">
            <h1 id="teamNameTop" class="team-name-top">NOME DO TIME</h1>
        </div>
        
        <div id="cardContainer" class="card-container">
            <div class="card-display">
                <div class="card-flipper">
                    <!-- Verso da carta -->
                    <div class="card-back">
                        <img src="/cartas/verso.png" alt="Verso da carta" class="card-image">
                    </div>
                    
                    <!-- Frente da carta -->
                    <div class="card-front">
                        <img id="cardImage" src="" alt="Carta" class="card-image">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="scripts/obs.js"></script>
</body>
</html>
